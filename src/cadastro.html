<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Administrativo - Criar Conta</title>
    <link rel="stylesheet" href="assets/css/estilo.css">
</head>
<body class="pagina-login">
    <main class="caixa-login">
        <span class="marca">
            <span class="marca-simbolo" aria-hidden="true">
                <img src="https://www.lmcorp.com.br/arquivos/img/assets/logo_tcg_2_color.png" alt="Logo do Portal Administrativo">
            </span>
        </span>
        <h1>Criar conta</h1>
        <p class="subtitulo">Portal Administrativo · Gestão de Cartas</p>

        <form id="form-cadastro" novalidate>
            <div class="campo">
                <label for="nome">Nome</label>
                <input type="text" id="nome" name="nome" autocomplete="name" required>
            </div>

            <div class="campo">
                <label for="usuario">Usuário</label>
                <input type="text" id="usuario" name="usuario" autocomplete="username" required>
            </div>

            <div class="campo">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" autocomplete="new-password" required>
            </div>

            <div class="campo">
                <label for="confirmar-senha">Confirmar senha</label>
                <input type="password" id="confirmar-senha" name="confirmar-senha" autocomplete="new-password" required>
            </div>

            <p id="erro-cadastro" class="mensagem-erro" hidden></p>

            <button type="submit" id="botao-criar" class="botao botao-primario botao-largo">Criar conta</button>
        </form>

        <p class="texto-suave link-rodape">Já tem conta? <a href="index.html">Entrar</a></p>
    </main>

    <script src="assets/js/validacao.js"></script>
    <script src="assets/js/cadastro.js"></script>
</body>
</html>
