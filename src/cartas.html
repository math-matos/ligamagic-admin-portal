<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Administrativo - Cartas</title>
    <link rel="stylesheet" href="assets/css/estilo.css">
</head>
<body>
    <header class="cabecalho">
        <div class="cabecalho-marca marca">
            <span class="marca-simbolo" aria-hidden="true">
                <img src="https://www.lmcorp.com.br/arquivos/img/assets/logo_tcg_2_color.png" alt="Logo do Portal Administrativo">
            </span>
            <div class="cabecalho-titulo">
                <h1>Gerenciador de Cartas</h1>
                <p id="saudacao" class="texto-suave"></p>
            </div>
        </div>
        <div class="cabecalho-usuario">
            <button type="button" id="botao-sair" class="botao botao-fantasma">
                <span class="icone" aria-hidden="true">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                </span>
                <span>Sair</span>
            </button>
        </div>
    </header>

    <main class="conteudo">
        <div class="filtros-backdrop" id="filtros-backdrop" hidden></div>

        <aside class="filtros-sidebar" id="filtros-sidebar" aria-label="Filtros de cartas">
            <div class="filtros-cabecalho">
                <h2>Filtros</h2>
                <button type="button" id="botao-limpar-filtros" class="botao-limpar-filtros" hidden>Limpar</button>
            </div>

            <div class="filtro-grupo">
                <h3 class="filtro-grupo-titulo">Card Game</h3>
                <span class="filtro-busca-campo">
                    <svg class="filtro-busca-icone" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="11" cy="11" r="7"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input type="search" id="busca-filtro-jogo" class="filtro-busca" placeholder="Buscar jogo..." aria-label="Buscar Card Game">
                </span>
                <div id="lista-filtro-jogo" class="filtro-opcoes">
                    <label class="filtro-opcao">
                        <input type="checkbox" class="filtro-checkbox" data-grupo="jogo" value="magic">
                        <span class="filtro-caixa" aria-hidden="true"></span>
                        <span class="filtro-texto">Magic: The Gathering</span>
                        <span class="filtro-contagem"></span>
                    </label>
                    <label class="filtro-opcao">
                        <input type="checkbox" class="filtro-checkbox" data-grupo="jogo" value="pokemon">
                        <span class="filtro-caixa" aria-hidden="true"></span>
                        <span class="filtro-texto">Pokémon</span>
                        <span class="filtro-contagem"></span>
                    </label>
                    <label class="filtro-opcao">
                        <input type="checkbox" class="filtro-checkbox" data-grupo="jogo" value="yugioh">
                        <span class="filtro-caixa" aria-hidden="true"></span>
                        <span class="filtro-texto">Yu-Gi-Oh!</span>
                        <span class="filtro-contagem"></span>
                    </label>
                </div>
                <p class="filtro-vazio" id="vazio-filtro-jogo" hidden>Nenhum resultado.</p>
            </div>

            <div class="filtro-grupo">
                <h3 class="filtro-grupo-titulo">Raridade</h3>
                <label class="filtro-opcao">
                    <input type="checkbox" class="filtro-checkbox" data-grupo="raridade" value="Comum">
                    <span class="filtro-caixa" aria-hidden="true"></span>
                    <span class="filtro-texto">Comum</span>
                    <span class="filtro-contagem"></span>
                </label>
                <label class="filtro-opcao">
                    <input type="checkbox" class="filtro-checkbox" data-grupo="raridade" value="Incomum">
                    <span class="filtro-caixa" aria-hidden="true"></span>
                    <span class="filtro-texto">Incomum</span>
                    <span class="filtro-contagem"></span>
                </label>
                <label class="filtro-opcao">
                    <input type="checkbox" class="filtro-checkbox" data-grupo="raridade" value="Rara">
                    <span class="filtro-caixa" aria-hidden="true"></span>
                    <span class="filtro-texto">Rara</span>
                    <span class="filtro-contagem"></span>
                </label>
                <label class="filtro-opcao">
                    <input type="checkbox" class="filtro-checkbox" data-grupo="raridade" value="Ultra Rara">
                    <span class="filtro-caixa" aria-hidden="true"></span>
                    <span class="filtro-texto">Ultra Rara</span>
                    <span class="filtro-contagem"></span>
                </label>
                <label class="filtro-opcao">
                    <input type="checkbox" class="filtro-checkbox" data-grupo="raridade" value="Secreta">
                    <span class="filtro-caixa" aria-hidden="true"></span>
                    <span class="filtro-texto">Secreta</span>
                    <span class="filtro-contagem"></span>
                </label>
                <label class="filtro-opcao">
                    <input type="checkbox" class="filtro-checkbox" data-grupo="raridade" value="Mítica">
                    <span class="filtro-caixa" aria-hidden="true"></span>
                    <span class="filtro-texto">Mítica</span>
                    <span class="filtro-contagem"></span>
                </label>
            </div>

            <div class="filtro-grupo">
                <h3 class="filtro-grupo-titulo">Edição</h3>
                <span class="filtro-busca-campo">
                    <svg class="filtro-busca-icone" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="11" cy="11" r="7"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input type="search" id="busca-filtro-edicao" class="filtro-busca" placeholder="Buscar edição..." aria-label="Buscar edição">
                </span>
                <div id="lista-filtro-edicao" class="filtro-lista-edicao"></div>
            </div>
        </aside>

        <div class="area-principal">
            <div class="barra-acoes">
                <button type="button" id="botao-alternar-filtros" class="botao botao-neutro botao-filtros-mobile" aria-expanded="false" aria-controls="filtros-sidebar">
                    <span class="icone" aria-hidden="true">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="4" y1="21" x2="4" y2="14"></line>
                            <line x1="4" y1="10" x2="4" y2="3"></line>
                            <line x1="12" y1="21" x2="12" y2="12"></line>
                            <line x1="12" y1="8" x2="12" y2="3"></line>
                            <line x1="20" y1="21" x2="20" y2="16"></line>
                            <line x1="20" y1="12" x2="20" y2="3"></line>
                            <line x1="1" y1="14" x2="7" y2="14"></line>
                            <line x1="9" y1="8" x2="15" y2="8"></line>
                            <line x1="17" y1="16" x2="23" y2="16"></line>
                        </svg>
                    </span>
                    Filtros
                    <span id="badge-filtros-ativos" class="badge-contagem-filtros" hidden>0</span>
                </button>
                <span class="campo-icone">
                    <span class="icone" aria-hidden="true">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="7"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                    </span>
                    <input type="search" id="campo-busca" placeholder="Buscar por nome, jogo, edição ou raridade...">
                </span>
                <div class="barra-acoes-fim">
                    <div class="alternar-visualizacao" role="group" aria-label="Modo de visualização">
                        <button type="button" id="ver-grade" class="botao-visualizacao" aria-pressed="true" aria-label="Visualizar em grade" title="Grade">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <rect x="3" y="3" width="7" height="7"></rect>
                                <rect x="14" y="3" width="7" height="7"></rect>
                                <rect x="14" y="14" width="7" height="7"></rect>
                                <rect x="3" y="14" width="7" height="7"></rect>
                            </svg>
                        </button>
                        <button type="button" id="ver-lista" class="botao-visualizacao" aria-pressed="false" aria-label="Visualizar em lista" title="Lista">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <line x1="8" y1="6" x2="21" y2="6"></line>
                                <line x1="8" y1="12" x2="21" y2="12"></line>
                                <line x1="8" y1="18" x2="21" y2="18"></line>
                                <line x1="3" y1="6" x2="3.01" y2="6"></line>
                                <line x1="3" y1="12" x2="3.01" y2="12"></line>
                                <line x1="3" y1="18" x2="3.01" y2="18"></line>
                            </svg>
                        </button>
                    </div>
                    <button type="button" id="botao-nova-carta" class="botao botao-primario">
                        <span class="icone" aria-hidden="true">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="12" y1="5" x2="12" y2="19"></line>
                                <line x1="5" y1="12" x2="19" y2="12"></line>
                            </svg>
                        </span>
                        Nova Carta
                    </button>
                </div>
            </div>

            <div class="tabela-container" id="painel-lista">
                <div class="tabela-scroll">
                    <table class="tabela-cartas">
                        <thead>
                            <tr>
                                <th>Imagem</th>
                                <th><svg class="bandeira-icone" viewBox="0 0 20 14" role="img" aria-label="Inglês (EUA)"><rect width="20" height="14" fill="#fff"></rect><rect y="0" width="20" height="2" fill="#B22234"></rect><rect y="4" width="20" height="2" fill="#B22234"></rect><rect y="8" width="20" height="2" fill="#B22234"></rect><rect y="12" width="20" height="2" fill="#B22234"></rect><rect width="8" height="8" fill="#3C3B6E"></rect></svg> Nome (EN)</th>
                                <th><svg class="bandeira-icone" viewBox="0 0 20 14" role="img" aria-label="Português (Brasil)"><rect width="20" height="14" fill="#009739"></rect><polygon points="10,1.5 18.5,7 10,12.5 1.5,7" fill="#FEDD00"></polygon><circle cx="10" cy="7" r="3.2" fill="#012169"></circle></svg> Nome (PT)</th>
                                <th>Card Game</th>
                                <th>Edição</th>
                                <th>Raridade</th>
                                <th><span class="visualmente-oculto">Ações</span></th>
                            </tr>
                        </thead>
                        <tbody id="lista-cartas"></tbody>
                    </table>
                </div>
            </div>

            <div id="painel-grade" class="grade-cartas" hidden></div>

            <div id="estado-vazio" class="estado-vazio" hidden>
                <span class="estado-vazio-icone" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="7"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </span>
                <span id="estado-vazio-texto">Nenhuma carta encontrada.</span>
                <span class="estado-vazio-dica">Tente outro termo ou cadastre uma nova carta.</span>
            </div>
        </div>
    </main>

    <p id="aviso" class="aviso" hidden></p>

    <div id="modal-formulario" class="modal" hidden>
        <div class="modal-caixa">
            <h2 id="titulo-formulario">Nova Carta</h2>

            <form id="form-carta" novalidate>
                <input type="hidden" id="carta-id">

                <div class="campo">
                    <label for="nome-en"><svg class="bandeira-icone" viewBox="0 0 20 14" role="img" aria-label="Inglês (EUA)"><rect width="20" height="14" fill="#fff"></rect><rect y="0" width="20" height="2" fill="#B22234"></rect><rect y="4" width="20" height="2" fill="#B22234"></rect><rect y="8" width="20" height="2" fill="#B22234"></rect><rect y="12" width="20" height="2" fill="#B22234"></rect><rect width="8" height="8" fill="#3C3B6E"></rect></svg> Nome da Carta em inglês *</label>
                    <input type="text" id="nome-en" name="nome_en" required>
                </div>

                <div class="campo">
                    <label for="nome-pt"><svg class="bandeira-icone" viewBox="0 0 20 14" role="img" aria-label="Português (Brasil)"><rect width="20" height="14" fill="#009739"></rect><polygon points="10,1.5 18.5,7 10,12.5 1.5,7" fill="#FEDD00"></polygon><circle cx="10" cy="7" r="3.2" fill="#012169"></circle></svg> Nome da Carta em português</label>
                    <input type="text" id="nome-pt" name="nome_pt">
                </div>

                <div class="campo">
                    <label for="card-game">Card Game *</label>
                    <select id="card-game" name="card_game" required>
                        <option value="">Selecione...</option>
                        <option value="magic">Magic: The Gathering</option>
                        <option value="pokemon">Pokémon</option>
                        <option value="yugioh">Yu-Gi-Oh!</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="edicao">Edição da Carta *</label>
                    <select id="edicao" name="edicao_id" required disabled>
                        <option value="">Selecione um Card Game primeiro</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="raridade">Raridade da Carta *</label>
                    <select id="raridade" name="raridade" required>
                        <option value="">Selecione...</option>
                        <option value="Comum">Comum</option>
                        <option value="Incomum">Incomum</option>
                        <option value="Rara">Rara</option>
                        <option value="Ultra Rara">Ultra Rara</option>
                        <option value="Secreta">Secreta</option>
                        <option value="Mítica">Mítica</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="imagem">Imagem da Carta *</label>
                    <label class="dropzone" for="imagem">
                        <span class="dropzone-icone" aria-hidden="true">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                <polyline points="17 8 12 3 7 8"></polyline>
                                <line x1="12" y1="3" x2="12" y2="15"></line>
                            </svg>
                        </span>
                        <span class="dropzone-texto">
                            <strong>Clique para enviar</strong>
                            PNG, JPG, WEBP ou GIF
                        </span>
                        <input type="file" id="imagem" name="imagem" accept="image/jpeg,image/png,image/webp,image/gif">
                    </label>
                    <img id="previa-imagem" class="previa-imagem" alt="Prévia da imagem" hidden>
                </div>

                <p id="erro-formulario" class="mensagem-erro" hidden></p>

                <div class="modal-acoes">
                    <button type="button" id="botao-cancelar" class="botao botao-neutro">Cancelar</button>
                    <button type="submit" id="botao-salvar" class="botao botao-primario">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <div id="modal-imagem" class="modal modal-imagem" hidden>
        <button type="button" id="botao-fechar-imagem" class="botao-fechar-modal" aria-label="Fechar">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
        </button>

        <div class="visualizador-imagem-area" id="visualizador-imagem-area">
            <img id="visualizador-imagem" alt="">
        </div>

        <div class="visualizador-imagem-barra">
            <button type="button" id="zoom-diminuir" aria-label="Diminuir zoom">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="7"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    <line x1="8" y1="11" x2="14" y2="11"></line>
                </svg>
            </button>
            <span id="zoom-percentual">100%</span>
            <button type="button" id="zoom-aumentar" aria-label="Aumentar zoom">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="7"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    <line x1="11" y1="8" x2="11" y2="14"></line>
                    <line x1="8" y1="11" x2="14" y2="11"></line>
                </svg>
            </button>
            <button type="button" id="zoom-resetar" aria-label="Restaurar zoom">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="1 4 1 10 7 10"></polyline>
                    <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
                </svg>
            </button>
        </div>
    </div>

    <div id="modal-exclusao" class="modal" hidden>
        <div class="modal-caixa">
            <h2>Excluir Carta</h2>
            <p id="texto-exclusao"></p>
            <p class="texto-suave">Essa ação não pode ser desfeita.</p>

            <div class="modal-acoes">
                <button type="button" id="botao-cancelar-exclusao" class="botao botao-neutro">Cancelar</button>
                <button type="button" id="botao-confirmar-exclusao" class="botao botao-perigo">Excluir</button>
            </div>
        </div>
    </div>

    <script src="assets/js/cartas.js"></script>
    <script src="assets/js/style/visualizador-imagem.js"></script>
    <script src="assets/js/formulario.js"></script>
    <script src="assets/js/style/dropdown.js"></script>
</body>
</html>
