<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Administrativo - Cartas</title>
    <link rel="stylesheet" href="assets/css/estilo.css">
</head>
<body>
    <header class="cabecalho">
        <div class="cabecalho-marca marca">
            <span class="marca-simbolo" aria-hidden="true">
                <img src="https://www.lmcorp.com.br/arquivos/img/assets/logo_tcg_2_color.png" alt="Logo do Portal Administrativo">
            </span>
            <div class="cabecalho-titulo">
                <h1>Gerenciador de Cartas</h1>
                <p id="saudacao" class="texto-suave"></p>
            </div>
        </div>
        <div class="cabecalho-usuario">
            <button type="button" id="botao-sair" class="botao botao-fantasma">
                <span class="icone" aria-hidden="true">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                </span>
                <span>Sair</span>
            </button>
        </div>
    </header>

    <main class="conteudo">
        <div class="barra-acoes">
            <span class="campo-icone">
                <span class="icone" aria-hidden="true">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="7"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </span>
                <input type="search" id="campo-busca" placeholder="Buscar por nome, jogo, edição ou raridade...">
            </span>
            <button type="button" id="botao-nova-carta" class="botao botao-primario">
                <span class="icone" aria-hidden="true">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                </span>
                Nova Carta
            </button>
        </div>

        <div class="tabela-container">
            <div class="tabela-scroll">
                <table class="tabela-cartas">
                    <thead>
                        <tr>
                            <th>Imagem</th>
                            <th>Nome (EN)</th>
                            <th>Nome (PT)</th>
                            <th>Card Game</th>
                            <th>Edição</th>
                            <th>Raridade</th>
                            <th><span class="visualmente-oculto">Ações</span></th>
                        </tr>
                    </thead>
                    <tbody id="lista-cartas"></tbody>
                </table>
            </div>
            <div id="estado-vazio" class="estado-vazio" hidden>
                <span class="estado-vazio-icone" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="7"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </span>
                <span id="estado-vazio-texto">Nenhuma carta encontrada.</span>
                <span class="estado-vazio-dica">Tente outro termo ou cadastre uma nova carta.</span>
            </div>
        </div>
    </main>

    <p id="aviso" class="aviso" hidden></p>

    <div id="modal-formulario" class="modal" hidden>
        <div class="modal-caixa">
            <h2 id="titulo-formulario">Nova Carta</h2>

            <form id="form-carta" novalidate>
                <input type="hidden" id="carta-id">

                <div class="campo">
                    <label for="nome-en">Nome da Carta em inglês *</label>
                    <input type="text" id="nome-en" name="nome_en" required>
                </div>

                <div class="campo">
                    <label for="nome-pt">Nome da Carta em português</label>
                    <input type="text" id="nome-pt" name="nome_pt">
                </div>

                <div class="campo">
                    <label for="card-game">Card Game *</label>
                    <select id="card-game" name="card_game" required>
                        <option value="">Selecione...</option>
                        <option value="magic">Magic: The Gathering</option>
                        <option value="pokemon">Pokémon</option>
                        <option value="yugioh">Yu-Gi-Oh!</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="edicao">Edição da Carta *</label>
                    <select id="edicao" name="edicao_id" required disabled>
                        <option value="">Selecione um Card Game primeiro</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="raridade">Raridade da Carta *</label>
                    <select id="raridade" name="raridade" required>
                        <option value="">Selecione...</option>
                        <option value="Comum">Comum</option>
                        <option value="Incomum">Incomum</option>
                        <option value="Rara">Rara</option>
                        <option value="Ultra Rara">Ultra Rara</option>
                        <option value="Secreta">Secreta</option>
                        <option value="Mítica">Mítica</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="imagem">Imagem da Carta *</label>
                    <label class="dropzone" for="imagem">
                        <span class="dropzone-icone" aria-hidden="true">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                <polyline points="17 8 12 3 7 8"></polyline>
                                <line x1="12" y1="3" x2="12" y2="15"></line>
                            </svg>
                        </span>
                        <span class="dropzone-texto">
                            <strong>Clique para enviar</strong>
                            PNG, JPG, WEBP ou GIF
                        </span>
                        <input type="file" id="imagem" name="imagem" accept="image/jpeg,image/png,image/webp,image/gif">
                    </label>
                    <img id="previa-imagem" class="previa-imagem" alt="Prévia da imagem" hidden>
                </div>

                <p id="erro-formulario" class="mensagem-erro" hidden></p>

                <div class="modal-acoes">
                    <button type="button" id="botao-cancelar" class="botao botao-neutro">Cancelar</button>
                    <button type="submit" id="botao-salvar" class="botao botao-primario">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <div id="modal-exclusao" class="modal" hidden>
        <div class="modal-caixa">
            <h2>Excluir Carta</h2>
            <p id="texto-exclusao"></p>
            <p class="texto-suave">Essa ação não pode ser desfeita.</p>

            <div class="modal-acoes">
                <button type="button" id="botao-cancelar-exclusao" class="botao botao-neutro">Cancelar</button>
                <button type="button" id="botao-confirmar-exclusao" class="botao botao-perigo">Excluir</button>
            </div>
        </div>
    </div>

    <script src="assets/js/cartas.js"></script>
    <script src="assets/js/formulario.js"></script>
</body>
</html>
