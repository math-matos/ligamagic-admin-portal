services:
  web:
    build: .
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_NAME: portal_cartas
      DB_USER: portal
      DB_PASS: portal123

  db:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: portal_cartas
      MYSQL_USER: portal
      MYSQL_PASSWORD: portal123
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uportal", "-pportal123"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
