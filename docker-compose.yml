services:
  frontend:
    image: nginx:alpine
    container_name: frontend_service
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./src:/usr/share/nginx/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - private_network
      - public_network

  backend:
    build: .
    container_name: backend_service
    restart: always
    volumes:
      - ./src:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_NAME: portal_cartas
      DB_USER: portal
      DB_PASS: portal123
    networks:
      - private_network

  db:
    image: mysql:8.0
    container_name: db_service
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: portal_cartas
      MYSQL_USER: portal
      MYSQL_PASSWORD: portal123
    networks:
      - private_network
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uportal", "-pportal123"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  private_network:
    driver: bridge
  public_network:
    driver: bridge

volumes:
  db_data:
